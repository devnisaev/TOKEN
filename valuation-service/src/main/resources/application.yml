spring:
  application:
    name: valuation-service

  datasource:
    url: jdbc:postgresql://localhost:5432/valuation_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: valuation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8095
  servlet:
    context-path: /api

tokenrealty:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    issuer: tokenrealty-auth
  valuation:
    revaluation:
      poll-ms: 60000
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    serialization: ${KAFKA_SERIALIZATION:json}
    dlq:
      enabled: ${KAFKA_DLQ_ENABLED:false}
      max-retries: 3
      backoff-ms: 1000
    relay:
      poll-ms: 1000
      publish-timeout-ms: 10000
      max-retries: 5
    topic:
      valuation-updated: tokenrealty.valuation.updated.v1
      valuation-approved: tokenrealty.valuation.approved.v1

jackson2:
  serialization:
    write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.tokenrealty: DEBUG
