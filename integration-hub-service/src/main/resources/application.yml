spring:
  application:
    name: integration-hub-service
  datasource:
    url: jdbc:postgresql://localhost:5432/integration_hub_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8099
  servlet:
    context-path: /api

services:
  compliance:
    url: ${COMPLIANCE_URL:http://localhost:8087/api}
  document:
    url: ${DOCUMENT_URL:http://localhost:8088/api}
  payment:
    url: ${PAYMENT_URL:http://localhost:8085/api}

tokenrealty:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    issuer: tokenrealty-auth
  integration:
    retry:
      max-attempts: 5
      base-backoff-seconds: 30
      poll-ms: 5000
    kms:
      mode: ${INTEGRATION_KMS_MODE:local}
      local-key: ${INTEGRATION_KMS_LOCAL_KEY:dev-integration-kms-key-change-me}
      key-id: ${INTEGRATION_KMS_KEY_ID:alias/tokenrealty-integration}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.tokenrealty: DEBUG
