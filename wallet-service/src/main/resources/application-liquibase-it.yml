spring:
  autoconfigure:
    exclude:
      - com.tokenrealty.security.config.ServiceTokenAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

tokenrealty:
  jwt:
    secret: test-jwt-secret-min-32-characters-long!!
    issuer: tokenrealty-auth
  wallet:
    encryption-key: test-wallet-encryption-key-32b!!
    seed-dev-wallets: false
