spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

server:
  port: 8089
  servlet:
    context-path: /api

tokenrealty:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    issuer: tokenrealty-auth
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    dlq:
      enabled: ${KAFKA_DLQ_ENABLED:false}
      max-retries: 3
      backoff-ms: 1000
    topic:
      building-approved: tokenrealty.registry.building.approved.v1
      flat-tokenized: tokenrealty.registry.flat.tokenized.v1
      rent-due: tokenrealty.rental.rent.due.v1
      lease-expired: tokenrealty.rental.lease.expired.v1
      listing-created: tokenrealty.marketplace.listing.created.v1
      order-matched: tokenrealty.marketplace.order.matched.v1
      payment-confirmed: tokenrealty.payment.payment.confirmed.v1
      transfer-completed: tokenrealty.issuance.transfer.completed.v1
      kyc-approved: tokenrealty.compliance.investor.kyc-approved.v1
      kyc-revoked: tokenrealty.compliance.investor.kyc-revoked.v1
      trade-settled: tokenrealty.marketplace.trade.settled.v1
      dividend-distributed: tokenrealty.issuance.dividend.distributed.v1
      rent-collected: tokenrealty.payment.rent.collected.v1
      document-uploaded: tokenrealty.document.document.uploaded.v1
  notification:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
      mode: ${NOTIFICATION_EMAIL_MODE:log}
      default-recipient: ${NOTIFICATION_EMAIL_DEFAULT:admin@tokenrealty.com}
      from: ${NOTIFICATION_EMAIL_FROM:noreply@tokenrealty.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.tokenrealty: DEBUG
