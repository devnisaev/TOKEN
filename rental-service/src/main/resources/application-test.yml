spring:
  autoconfigure:
    exclude:
      - com.tokenrealty.security.config.ServiceTokenAutoConfiguration
  datasource:
    url: jdbc:h2:mem:rental_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

tokenrealty:
  rental:
    seed-demo-lease: false
  jwt:
    secret: test-jwt-secret-min-32-characters-long!!
    issuer: tokenrealty-auth
  kafka:
    enabled: false

services:
  payment:
    url: http://localhost:8085/api
