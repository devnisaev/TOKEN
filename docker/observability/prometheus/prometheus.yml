global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/tokenrealty-alerts.yml

scrape_configs:
  - job_name: tokenrealty-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: api-gateway

  - job_name: tokenrealty-services
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets:
          - 'host.docker.internal:8081'
          - 'host.docker.internal:8082'
          - 'host.docker.internal:8083'
          - 'host.docker.internal:8084'
          - 'host.docker.internal:8085'
          - 'host.docker.internal:8086'
          - 'host.docker.internal:8087'
          - 'host.docker.internal:8088'
          - 'host.docker.internal:8089'
          - 'host.docker.internal:8090'
          - 'host.docker.internal:8091'
        labels:
          platform: tokenrealty
