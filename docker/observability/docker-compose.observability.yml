# TokenRealty metrics stack — Prometheus + Grafana.
#
# Usage (from repo root):
#   docker compose -f docker/observability/docker-compose.observability.yml up -d
#
# Prerequisites: platform services running locally on default ports (8080–8091).
# Prometheus scrapes Spring Actuator /prometheus endpoints (see prometheus/prometheus.yml).
#
# Grafana: http://localhost:3000  (admin / admin)
# Prometheus: http://localhost:9090

version: '3.9'

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tokenrealty-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tokenrealty-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
