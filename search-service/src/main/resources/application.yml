spring:
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://localhost:5432/search_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8098
  servlet:
    context-path: /api

services:
  property-registry:
    url: ${PROPERTY_REGISTRY_URL:http://localhost:8081/api}

tokenrealty:
  search:
    backend: ${SEARCH_BACKEND:postgres}
    opensearch:
      url: ${OPENSEARCH_URL:http://localhost:9200}
      listings-index: tokenrealty-listings
      buildings-index: tokenrealty-buildings
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    issuer: tokenrealty-auth
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topic:
      listing-created: tokenrealty.marketplace.listing.created.v1
      flat-tokenized: tokenrealty.registry.flat.tokenized.v1
      building-approved: tokenrealty.registry.building.approved.v1
      valuation-updated: tokenrealty.valuation.updated.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.tokenrealty: DEBUG
