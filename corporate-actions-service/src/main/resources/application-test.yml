spring:
  datasource:
    url: jdbc:h2:mem:corporate_actions_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

tokenrealty:
  kafka:
    enabled: false

services:
  token-issuance:
    url: http://localhost:8082/api
