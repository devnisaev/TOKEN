spring:
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true

tokenrealty:
  document:
    ipfs:
      # Production: IPFS_MODE=pinata (PINATA_JWT) or kubo (IPFS_KUBO_API_URL).
      mode: ${IPFS_MODE:pinata}
      kubo:
        api-url: ${IPFS_KUBO_API_URL:http://ipfs:5001}
      pinata:
        jwt: ${PINATA_JWT}

logging:
  level:
    com.tokenrealty: INFO
