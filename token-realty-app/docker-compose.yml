version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: property-registry-db
    environment:
      POSTGRES_DB: property_registry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/02-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional DB browser) ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: property-registry-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tokenrealty.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools   # only starts with: docker compose --profile tools up

  # ── Spring Boot app ─────────────────────────────────────────────────────────
  property-registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-registry-app
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/property_registry
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app   # only starts with: docker compose --profile app up

  # ── Kafka (KRaft single node) ───────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.8
    container_name: tokenrealty-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    profiles:
      - kafka

  # ── MinIO (optional private document storage) ─────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: tokenrealty-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - minio_data:/data
    profiles:
      - storage

  # ── Jaeger (OTLP traces) ────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.64
    container_name: tokenrealty-jaeger
    ports:
      - "4318:4318"   # OTLP HTTP
      - "16686:16686" # UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles:
      - otel
      - demo

volumes:
  postgres_data:
  minio_data: