version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: property-registry-db
    environment:
      POSTGRES_DB: property_registry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional DB browser) ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: property-registry-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tokenrealty.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools   # only starts with: docker compose --profile tools up

  # ── Spring Boot app ─────────────────────────────────────────────────────────
  property-registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-registry-app
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/property_registry
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app   # only starts with: docker compose --profile app up

volumes:
  postgres_data: