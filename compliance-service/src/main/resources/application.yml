spring:
  application:
    name: compliance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/compliance_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: compliance-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8087
  servlet:
    context-path: /api

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8083/api}
  property-registry:
    url: ${PROPERTY_REGISTRY_URL:http://localhost:8081/api}

tokenrealty:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    issuer: tokenrealty-auth
  service-account:
    client-id: compliance
    client-secret: ${SERVICE_ACCOUNT_SECRET:compliance-secret}
  compliance:
    seed-dev-records: ${SEED_DEV_COMPLIANCE:true}
    kyc-expiry:
      cron: ${KYC_EXPIRY_CRON:0 0 6 * * *}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    relay:
      poll-ms: 1000
      publish-timeout-ms: 10000
      max-retries: 5
    topic:
      kyc-approved: tokenrealty.compliance.investor.kyc-approved.v1
      kyc-revoked: tokenrealty.compliance.investor.kyc-revoked.v1
      document-uploaded: tokenrealty.document.document.uploaded.v1

jackson2:
  serialization:
    write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.tokenrealty: DEBUG
