spring:
  datasource:
    url: jdbc:h2:mem:compliance_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS COMPLIANCE_TEST
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: COMPLIANCE_TEST
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    listener:
      auto-startup: false

tokenrealty:
  compliance:
    seed-dev-records: false
  kafka:
    enabled: false
