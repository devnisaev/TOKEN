openapi: 3.0.3
info:
  title: TokenRealty Property Registry API
  version: 1.0.0
paths:
  /v1/buildings:
    get:
      operationId: listBuildings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingPage'
    post:
      operationId: createBuilding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildingRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingResponse'
  /v1/buildings/{id}:
    get:
      operationId: getBuilding
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingDetailResponse'
    put:
      operationId: updateBuilding
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuildingRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingResponse'
  /v1/buildings/{buildingId}/flats:
    get:
      operationId: listFlatsByBuilding
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatPage'
    post:
      operationId: createFlat
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlatRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatResponse'
  /v1/flats/{id}:
    get:
      operationId: getFlat
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatResponse'
    put:
      operationId: updateFlat
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlatRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatResponse'
components:
  schemas:
    BuildingPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BuildingResponse'
        totalElements: { type: integer }
    BuildingResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        status: { type: string }
        flatCount: { type: integer }
        propertyCategory: { type: string }
    BuildingDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BuildingResponse'
        - type: object
          properties:
            postalCode: { type: string }
            totalFloors: { type: integer }
            totalFlats: { type: integer }
            constructionYear: { type: integer }
            totalAreaSqm: { type: number }
            cadastralReference: { type: string }
            flats:
              type: array
              items:
                $ref: '#/components/schemas/FlatSummary'
            spv:
              $ref: '#/components/schemas/SpvSummary'
    CreateBuildingRequest:
      type: object
      required: [name, address, city, country]
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        postalCode: { type: string }
        totalFloors: { type: integer }
        totalFlats: { type: integer }
        constructionYear: { type: integer }
        totalAreaSqm: { type: number }
        propertyCategory: { type: string }
        cadastralReference: { type: string }
    UpdateBuildingRequest:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        postalCode: { type: string }
        totalFloors: { type: integer }
        totalAreaSqm: { type: number }
        propertyCategory: { type: string }
        cadastralReference: { type: string }
    FlatPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/FlatResponse'
        totalElements: { type: integer }
    FlatSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        flatNumber: { type: string }
        floor: { type: integer }
        areaSqm: { type: number }
        status: { type: string }
        tokenPriceUsd: { type: number }
    FlatResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        buildingName: { type: string }
        flatNumber: { type: string }
        floor: { type: integer }
        areaSqm: { type: number }
        netUsableAreaSqm: { type: number }
        cadastralReference: { type: string }
        numRooms: { type: integer }
        numBathrooms: { type: integer }
        status: { type: string }
        tokenContractAddress: { type: string }
        totalTokens: { type: integer }
        tokenPriceUsd: { type: number }
    CreateFlatRequest:
      type: object
      required: [flatNumber, floor, areaSqm, numRooms, numBathrooms]
      properties:
        flatNumber: { type: string }
        floor: { type: integer }
        areaSqm: { type: number }
        numRooms: { type: integer }
        numBathrooms: { type: integer }
        cadastralReference: { type: string }
        netUsableAreaSqm: { type: number }
    UpdateFlatRequest:
      type: object
      properties:
        flatNumber: { type: string }
        floor: { type: integer }
        areaSqm: { type: number }
        numRooms: { type: integer }
        numBathrooms: { type: integer }
        cadastralReference: { type: string }
        netUsableAreaSqm: { type: number }
    SpvSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalName: { type: string }
        registrationNumber: { type: string }
        kycVerified: { type: boolean }
        status: { type: string }
        walletAddress: { type: string }
