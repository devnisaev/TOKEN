spring:
  application:
    name: token-issuance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/token_issuance
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes

jackson2:
  serialization:
    write-dates-as-timestamps: false
  deserialization:
    fail-on-unknown-properties: false

server:
  port: 8082
  servlet:
    context-path: /api

# ─── Property Registry FeignClient ────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: token-issuance-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8083/api}
  property-registry:
    url: ${PROPERTY_REGISTRY_URL:http://localhost:8081/api}
  marketplace:
    url: ${MARKETPLACE_SERVICE_URL:http://localhost:8084/api}

tokenrealty:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    issuer: tokenrealty-auth
  service-account:
    client-id: token-issuance
    client-secret: ${SERVICE_ACCOUNT_SECRET:issuance-secret}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    relay:
      poll-ms: 1000
      publish-timeout-ms: 10000
      max-retries: 5
    topic:
      payment-confirmed: tokenrealty.payment.payment.confirmed.v1
      transfer-completed: tokenrealty.issuance.transfer.completed.v1

feign:
  client:
    config:
      property-registry:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: basic

# ─── Blockchain config (overridden per profile) ───────────────────────────────
blockchain:
  network: local
  rpc-url: ${BLOCKCHAIN_RPC_URL:http://localhost:8545}
  chain-id: ${BLOCKCHAIN_CHAIN_ID:31337}
  # SPV operator wallet — NEVER commit real private keys
  operator-private-key: ${OPERATOR_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
  gas-limit: 500000
  # Contract addresses (populated after deployment)
  compliance-registry-address: ${COMPLIANCE_REGISTRY_ADDRESS:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.tokenrealty: DEBUG
    org.web3j: INFO
    org.springframework.security: INFO

---
# ─── LOCAL profile — Hardhat node ─────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local

blockchain:
  network: hardhat
  rpc-url: http://localhost:8545
  chain-id: 31337
  # Hardhat account #0 default private key (public knowledge — dev only)
  operator-private-key: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

---
# ─── STAGING profile — Polygon Amoy testnet ───────────────────────────────────
spring:
  config:
    activate:
      on-profile: staging

blockchain:
  network: polygon-amoy
  rpc-url: ${POLYGON_AMOY_RPC_URL:https://rpc-amoy.polygon.technology}
  chain-id: 80002
  # Set via environment variable — never hardcode
  operator-private-key: ${OPERATOR_PRIVATE_KEY}

logging:
  level:
    com.tokenrealty: INFO
    org.web3j: WARN