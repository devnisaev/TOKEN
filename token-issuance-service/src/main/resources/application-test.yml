spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: false

  # Disable Redis for unit tests
  cache:
    type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - com.tokenrealty.security.config.ServiceTokenAutoConfiguration

blockchain:
  network: hardhat
  rpc-url: http://localhost:8545
  chain-id: 31337
  operator-private-key: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  gas-limit: 500000
  compliance-registry-address: "0x0000000000000000000000000000000000000000"

services:
  property-registry:
    url: http://127.0.0.1:9999/api

tokenrealty:
  jwt:
    secret: test-jwt-secret-min-32-characters-long!!
    issuer: tokenrealty-auth

logging:
  level:
    com.tokenrealty: DEBUG
    org.hibernate.SQL: DEBUG