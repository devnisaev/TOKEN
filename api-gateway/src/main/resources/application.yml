spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8083/api}
  property-registry:
    url: ${PROPERTY_REGISTRY_URL:http://localhost:8081/api}
  token-issuance:
    url: ${TOKEN_ISSUANCE_URL:http://localhost:8082/api}
  marketplace:
    url: ${MARKETPLACE_SERVICE_URL:http://localhost:8084/api}
  wallet:
    url: ${WALLET_SERVICE_URL:http://localhost:8090/api}

tokenrealty:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    issuer: tokenrealty-auth
  service-account:
    client-id: api-gateway
    client-secret: ${SERVICE_ACCOUNT_SECRET:gateway-secret}
  gateway:
    cors:
      allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}
    routes:
      - id: auth
        target: http://localhost:8083
        paths:
          - /api/v1/auth
          - /api/v1/users
      - id: document-service
        target: http://localhost:8088
        paths:
          - /api/v1/documents
      - id: notification
        target: http://localhost:8089
        paths:
          - /api/v1/notifications
      - id: property-registry
        target: http://localhost:8081
        paths:
          - /api/v1/buildings
          - /api/v1/flats
          - /api/v1/spv
          - /api/v1/valuations
          - /api/v1/documents
      - id: token-issuance
        target: http://localhost:8082
        paths:
          - /api/v1/tokens
          - /api/v1/transfers
          - /api/v1/dividends
          - /api/v1/investors
      - id: compliance
        target: http://localhost:8087
        paths:
          - /api/v1/compliance
      - id: marketplace
        target: http://localhost:8084
        paths:
          - /api/v1/listings
          - /api/v1/orders
      - id: payment
        target: http://localhost:8085
        paths:
          - /api/v1/payments
          - /api/v1/payouts
          - /api/v1/wallet-balances
      - id: rental
        target: http://localhost:8086
        paths:
          - /api/v1/leases
          - /api/v1/rent-payments
          - /api/v1/occupancy
      - id: wallet
        target: http://localhost:8090
        paths:
          - /api/v1/wallets
      - id: blockchain-indexer
        target: http://localhost:8091
        paths:
          - /api/v1/indexer

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.tokenrealty: DEBUG
