spring:
  cache:
    type: caffeine
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

services:
  auth:
    url: http://localhost:8083/api
  property-registry:
    url: http://localhost:8081/api
  token-issuance:
    url: http://localhost:8082/api
  marketplace:
    url: http://localhost:8084/api
  wallet:
    url: http://localhost:8090/api
  rental:
    url: http://localhost:8086/api
  reporting:
    url: http://localhost:8093/api
  settlement:
    url: http://localhost:8094/api
  valuation:
    url: http://localhost:8095/api
  audit-ledger:
    url: http://localhost:8096/api
  corporate-actions:
    url: http://localhost:8097/api

tokenrealty:
  jwt:
    secret: test-jwt-secret-min-32-characters-long!!
    issuer: tokenrealty-auth
  service-account:
    client-id: api-gateway
    client-secret: gateway-secret
  gateway:
    rate-limit:
      backend: memory
