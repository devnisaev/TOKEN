spring:
  application:
    name: settlement-service

  datasource:
    url: jdbc:postgresql://localhost:5432/settlement_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: settlement-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8094
  servlet:
    context-path: /api

tokenrealty:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    issuer: tokenrealty-auth
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    dlq:
      enabled: ${KAFKA_DLQ_ENABLED:false}
      max-retries: 3
      backoff-ms: 1000
    topic:
      order-matched: tokenrealty.marketplace.order.matched.v1
      payment-confirmed: tokenrealty.payment.payment.confirmed.v1
      transfer-completed: tokenrealty.issuance.transfer.completed.v1
      trade-settled: tokenrealty.marketplace.trade.settled.v1
  settlement:
    stuck-sla-minutes: ${SETTLEMENT_STUCK_SLA_MINUTES:30}
    stuck-check-ms: ${SETTLEMENT_STUCK_CHECK_MS:300000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.tokenrealty: DEBUG
