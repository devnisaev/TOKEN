name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run Java tests (all services)
        run: |
          ./token-realty-app/mvnw -f pom.xml test -q

  hardhat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: token-issuance-service/hardhat/package-lock.json

      - name: Install Hardhat dependencies
        working-directory: token-issuance-service/hardhat
        run: npm ci

      - name: Run Hardhat contract tests
        working-directory: token-issuance-service/hardhat
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [investor-portal, admin-dashboard, tenant-portal]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build shared-ui and ${{ matrix.app }}
        run: |
          cd frontend/shared-ui && npm ci
          cd ../${{ matrix.app }}
          npm ci
          npm run build

  frontend-e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontends
        run: |
          cd frontend/shared-ui && npm ci
          for app in investor-portal admin-dashboard tenant-portal; do
            cd ../$app
            npm ci
            npm run build
            cd ..
          done

      - name: Run Playwright smoke tests
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:smoke

  marketplace-testcontainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run marketplace Testcontainers buy-flow test
        working-directory: marketplace-service
        run: ../token-realty-app/mvnw test -Dtest=BuyFlowContainersIntegrationTest -q

  payment-testcontainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run payment Testcontainers integration tests
        working-directory: payment-service
        run: ../token-realty-app/mvnw test -Dtest=PaymentContainersIntegrationTest,BuyFlowPaymentIntegrationTest,LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q

  liquibase-migration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run Liquibase prod-profile migration tests
        run: |
          ./token-realty-app/mvnw -f token-realty-app/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f token-issuance-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f payment-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f auth-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f document-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f notification-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f wallet-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f blockchain-indexer-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f compliance-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f marketplace-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q
          ./token-realty-app/mvnw -f rental-service/pom.xml test -Dtest=LiquibaseMigrationIntegrationTest -Dsurefire.excludedGroups= -q

  kafka-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run Kafka ingest integration tests
        run: |
          ./token-realty-app/mvnw -f notification-service/pom.xml test -Dtest=NotificationKafkaIntegrationTest -q
          ./token-realty-app/mvnw -f marketplace-service/pom.xml test -Dtest=FlatTokenizedKafkaIntegrationTest,BuildingApprovedKafkaIntegrationTest,BuyFlowKafkaIntegrationTest -q
          ./token-realty-app/mvnw -f token-issuance-service/pom.xml test -Dtest=KycApprovedKafkaIntegrationTest,KycRevokedKafkaIntegrationTest,RentCollectedKafkaIntegrationTest,PaymentConfirmedKafkaIntegrationTest,PayoutCompletedKafkaIntegrationTest,RentDividendIntegrationTest -q
          ./token-realty-app/mvnw -f payment-service/pom.xml test -Dtest=OrderMatchedKafkaIntegrationTest,DividendDistributedKafkaIntegrationTest -q
          ./token-realty-app/mvnw -f token-realty-app/pom.xml test -Dtest=DocumentUploadedKafkaIntegrationTest,TransferCompletedKafkaIntegrationTest -q
          ./token-realty-app/mvnw -f compliance-service/pom.xml test -Dtest=DocumentUploadedKafkaIntegrationTest,KycWebhookIntegrationTest -q
          ./token-realty-app/mvnw -f rental-service/pom.xml test -Dtest=RentScheduleKafkaIntegrationTest -q
          ./token-realty-app/mvnw -f reporting-service/pom.xml test -Dtest=ReportingKafkaIntegrationTest -q
          ./token-realty-app/mvnw -f settlement-service/pom.xml test -Dtest=SettlementKafkaIntegrationTest -q
          ./token-realty-app/mvnw -f audit-ledger-service/pom.xml test -Dtest=AuditKafkaIntegrationTest -q
          ./token-realty-app/mvnw -f corporate-actions-service/pom.xml test -Dtest=CorporateActionsKafkaIntegrationTest -q
          ./token-realty-app/mvnw -f search-service/pom.xml test -Dtest=SearchKafkaIntegrationTest -q

  kafka-outbox-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run outbox relay, document outbox, and DLQ integration tests
        run: |
          ./token-realty-app/mvnw -f tokenrealty-outbox/pom.xml test -Dtest=OutboxRelayTest,OutboxRelayAvroTransformTest -q
          ./token-realty-app/mvnw -f marketplace-service/pom.xml test -Dtest=OutboxRelayIntegrationTest -q
          ./token-realty-app/mvnw -f payment-service/pom.xml test -Dtest=OutboxRelayIntegrationTest -q
          ./token-realty-app/mvnw -f compliance-service/pom.xml test -Dtest=OutboxRelayIntegrationTest -q
          ./token-realty-app/mvnw -f token-issuance-service/pom.xml test -Dtest=OutboxRelayIntegrationTest -q
          ./token-realty-app/mvnw -f token-realty-app/pom.xml test -Dtest=OutboxRelayIntegrationTest -q
          ./token-realty-app/mvnw -f rental-service/pom.xml test -Dtest=OutboxRelayIntegrationTest -q
          ./token-realty-app/mvnw -f blockchain-indexer-service/pom.xml test -Dtest=OutboxRelayIntegrationTest -q
          ./token-realty-app/mvnw -f document-service/pom.xml test -Dtest=OutboxRelayIntegrationTest,DocumentUploadedOutboxIntegrationTest -q
          ./token-realty-app/mvnw -f tokenrealty-kafka/pom.xml test -Dtest=KafkaDlqIntegrationTest -q

  marketplace-kafka-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run Testcontainers Kafka buy-flow test
        working-directory: marketplace-service
        run: ../token-realty-app/mvnw test -Dtest=BuyFlowKafkaContainersIntegrationTest -q

  registry-integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run Property Registry integration test
        working-directory: token-realty-app
        run: ../token-realty-app/mvnw test -Dtest=PropertyRegistryIntegrationTest -q

  service-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run rental, wallet, and indexer integration tests
        run: |
          ./token-realty-app/mvnw -f rental-service/pom.xml test -Dtest=RentPaymentIntegrationTest,MaintenanceTicketIntegrationTest -q
          ./token-realty-app/mvnw -f wallet-service/pom.xml test -Dtest=WalletAggregateBalanceIntegrationTest -q
          ./token-realty-app/mvnw -f blockchain-indexer-service/pom.xml test -Dtest=ReconciliationIntegrationTest,BalanceRemediationIntegrationTest -q
          ./token-realty-app/mvnw -f marketplace-service/pom.xml test -Dtest=BuyFlowIntegrationTest -q
          ./token-realty-app/mvnw -f compliance-service/pom.xml test -Dtest=DataRoomLoopIntegrationTest -q
          ./token-realty-app/mvnw -f integration-hub-service/pom.xml test -Dtest=WebhookRelayIntegrationTest -q

  issuance-integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install shared libraries
        run: ./token-realty-app/mvnw -f pom.xml -pl tokenrealty-security,tokenrealty-web,tokenrealty-jpa,tokenrealty-kafka,tokenrealty-events,tokenrealty-outbox install -q

      - name: Run Issuance PropertyRegistry WireMock test
        working-directory: token-issuance-service
        run: ../token-realty-app/mvnw test -Dtest=PropertyRegistryClientIntegrationTest -q

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-gateway
            port: 8080
          - service: auth-service
            port: 8083
          - service: token-realty-app
            port: 8081
          - service: marketplace-service
            port: 8084
          - service: payment-service
            port: 8085
          - service: token-issuance-service
            port: 8082
          - service: compliance-service
            port: 8087
          - service: document-service
            port: 8088
          - service: notification-service
            port: 8089
          - service: rental-service
            port: 8086
          - service: wallet-service
            port: 8090
          - service: blockchain-indexer-service
            port: 8091
          - service: reporting-service
            port: 8093
          - service: settlement-service
            port: 8094
          - service: valuation-service
            port: 8095
          - service: audit-ledger-service
            port: 8096
          - service: corporate-actions-service
            port: 8097
          - service: search-service
            port: 8098
          - service: integration-hub-service
            port: 8099
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }} Docker image
        run: ./scripts/docker-build.sh ${{ matrix.service }} ${{ matrix.port }}

  openapi-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/openapi/package-lock.json

      - name: Verify OpenAPI codegen
        working-directory: frontend/openapi
        run: |
          npm ci
          npm run codegen
          git diff --exit-code ../shared-api-types/

  compose-demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres + Kafka via Docker Compose
        run: docker compose --profile kafka up -d postgres kafka schema-registry

      - name: Validate demo scripts are executable
        run: |
          test -x scripts/demo-all.sh
          test -x scripts/demo-buy-flow.sh
          test -x scripts/seed-demo.sh
          test -x scripts/ci-compose-e2e.sh
          bash -n scripts/demo-all.sh
          bash -n scripts/demo-buy-flow.sh
          bash -n scripts/ci-compose-e2e.sh
          grep -q '\-\-maintenance' scripts/demo-all.sh

      - name: Tear down compose
        if: always()
        run: docker compose --profile kafka down -v

  compose-e2e-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run compose stack E2E subset
        run: chmod +x scripts/ci-compose-e2e.sh && ./scripts/ci-compose-e2e.sh

  frontend-e2e-spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontends and list full E2E specs
        working-directory: frontend/e2e
        run: |
          cd ../shared-ui && npm ci
          for app in investor-portal admin-dashboard tenant-portal; do
            cd ../$app && npm ci && npm run build && cd ..
          done
          cd ../e2e && npm ci && npx playwright install --with-deps chromium
          npx playwright test --list --project=full

  frontend-e2e-full:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontends
        run: |
          cd frontend/shared-ui && npm ci
          for app in investor-portal admin-dashboard tenant-portal; do
            cd ../$app
            npm ci
            npm run build
            cd ..
          done

      - name: Run Playwright full E2E (requires E2E_GATEWAY_URL secret)
        working-directory: frontend/e2e
        env:
          E2E_GATEWAY_URL: ${{ secrets.E2E_GATEWAY_URL }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          if [ -z "$E2E_GATEWAY_URL" ]; then
            echo "E2E_GATEWAY_URL secret not set — skipping full gateway tests"
            exit 0
          fi
          npm run test:full
